    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="512x512" href="/Assets/icon-512.png" />
    <link rel="apple-touch-icon" href="/Assets/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#17191d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="format-detection" content="telephone=no" />
    <title>PowerForecast — Smart Meralco Energy Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08091a] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white overscroll-none">
    <div id="root"></div>
    <script>
      // Clear any stale Service Worker and Cache Storage from previous production builds when testing in dev/LAN
      if (window.location.port === "5173" || window.location.hostname === "localhost" || window.location.hostname.startsWith("192.168.")) {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ("caches" in window) {
          caches.keys().then(function(keys) {
            for (var j = 0; j < keys.length; j++) {
              caches.delete(keys[j]);
            }
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
